<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain View · JMac Memory OS</title>
<link rel="stylesheet" href="/brain.css">
</head>
<body>
<header class="bar">
  <h1>Brain View <span class="tag">Test</span></h1>
  <nav class="views" aria-label="View">
    <button data-view="rings" title="Root in the middle, areas on the first ring, each memory type on its own ring">Rings</button>
    <button data-view="areas" title="One cluster per area, root in the middle">Areas</button>
    <button data-view="links" title="Force layout: memories that link to each other pull together">Links</button>
    <button data-view="timeline" title="Left to right by last change date, one lane per memory type">Timeline</button>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="Search Name, Description, Path" autocomplete="off" aria-label="Search">
    <ul id="hits" hidden></ul>
  </div>
  <div class="toggles">
    <button id="names" aria-pressed="false" title="Show every label">Names</button>
    <button id="motion" aria-pressed="false" title="Slow idle rotation in Rings and Areas">Motion</button>
    <button id="new" title="Create a new memory file in the repo">New</button>
    <button id="fit" title="Fit every visible node on screen">Fit</button>
    <button id="full" title="Full screen">Full Screen</button>
  </div>
</header>

<section class="stats" aria-label="Totals">
  <button class="stat" data-stat="areas"><b id="s-areas">–</b> Areas<i class="tip" data-tip="Count of projects. Each file names its project in a project: field, else a Project: line, else its folder path. Files with none go to general. Click to open the Areas view.">i</i></button>
  <button class="stat" data-stat="memories"><b id="s-mem">–</b> Memories<i class="tip" data-tip="Count of .md and .yaml files in the memory repo, not counting .git, scripts/ or archive/. Click to list them all.">i</i></button>
  <button class="stat" data-stat="links"><b id="s-links">–</b> Links<i class="tip" data-tip="Count of related:, supersedes:, [[name]] and Markdown links that match another file in the repo, by path, id or file name. Click to open the Links view.">i</i></button>
  <button class="stat" data-stat="unresolved"><b id="s-unres">–</b> Unresolved<i class="tip" data-tip="Links that match no file in the repo. Free-text supersedes: notes are not counted. Click to list them.">i</i></button>
  <button class="stat" data-stat="git"><b id="s-git">–</b> Not Pushed<i class="tip" data-tip="Local commits in the memory repo that GitHub does not have yet. New, Edit and Archive each commit locally and never push. Amber when above 0. Click for the push command.">i</i></button>
  <button class="stat" data-stat="built"><span id="s-built">–</span><i class="tip" data-tip="When build_graph.py last wrote data/graph.json. Amber after 24 hours. Click to see which repo it read.">i</i></button>
</section>

<aside class="legend" aria-label="Legend">
  <h2>Types <i class="tip" data-tip="Colour = the top folder in the repo: records, threads, artifacts and so on. Click a type to show only that type. Click again to show all.">i</i></h2>
  <ul id="types"></ul>
  <h2>Project <i class="tip" data-tip="Show one project only. Size of a dot = how many links it has.">i</i></h2>
  <select id="area" aria-label="Area"><option value="">All Projects</option></select>
  <p class="hint">Drag to pan · Wheel to zoom · Click a dot to open it</p>
</aside>

<main id="stage"><canvas id="c"></canvas><p id="status" class="status">Loading graph.json…</p></main>

<div id="shade" class="shade" hidden></div>
<aside id="card" class="card" hidden role="dialog" aria-modal="true" aria-labelledby="card-title">
  <button id="card-x" class="x" aria-label="Close">×</button>
  <div id="card-body"></div>
</aside>

<div id="tipbox" class="tipbox" hidden></div>
<script src="/brain.js"></script>
</body>
</html>
